# To get started with Dependabot version updates, you'll need to specify which
# package ecosystems to update and where the package manifests are located.
# Please see the documentation for all configuration options:
# https://help.github.com/github/administering-a-repository/configuration-options-for-dependency-updates

version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      # Check for updates to GitHub Actions every weekday
      interval: "daily"
    commit-message:
      prefix: "ci"
      include: "scope"

  - package-ecosystem: "docker"
    directory: "/core"
    schedule:
      interval: "daily"
    commit-message:
      prefix: "docker"
    groups:
      docker-updates:
        patterns:
          - "*"

  - package-ecosystem: "docker"
    directory: "/modules"
    schedule:
      interval: "daily"
    commit-message:
      prefix: "docker"
    groups:
      docker-updates:
        patterns:
          - "*"

  - package-ecosystem: "docker"
    directory: "/nginx"
    schedule:
      interval: "daily"
    commit-message:
      prefix: "docker"
    groups:
      docker-updates:
        patterns:
          - "*"

  - package-ecosystem: "docker"
    directory: "/guard"
    schedule:
      interval: "daily"
    commit-message:
      prefix: "docker"
    groups:
      docker-updates:
        patterns:
          - "*"
